apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: sentinel-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: cloud-secret-manager
  target:
    name: sentinel-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: sentinel/prod   # keys: SENTINEL_DATABASE_URL, SENTINEL_API_KEYS, SENTINEL_WEBHOOK_TOKEN, ...
