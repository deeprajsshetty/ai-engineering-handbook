# Production: secrets are provided by External Secrets Operator from the cloud secret manager.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - external-secret.yaml
  - ingress.yaml
images:
  - name: sentinel
    newName: ghcr.io/deeprajsshetty/sentinel
    newTag: "1.0.0"   # CI pins this to an immutable digest on release
