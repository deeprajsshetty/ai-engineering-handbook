apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-api
  labels:
    app.kubernetes.io/name: sentinel-api
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: sentinel
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: sentinel-api}
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: sentinel
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: sentinel-config}
            - secretRef: {name: sentinel-secrets}
          env:
            - {name: OTEL_SERVICE_NAME, value: sentinel-api}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: sentinel-api
  labels:
    app.kubernetes.io/name: sentinel-api
spec:
  selector:
    app.kubernetes.io/name: sentinel-api
  ports:
    - {name: http, port: 80, targetPort: http}
