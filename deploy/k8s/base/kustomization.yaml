apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: sentinel
labels:
  - pairs:
      app.kubernetes.io/part-of: sentinel
    includeSelectors: false
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
images:
  - name: sentinel
    newName: ghcr.io/deeprajsshetty/sentinel
    newTag: "1.0.0"
