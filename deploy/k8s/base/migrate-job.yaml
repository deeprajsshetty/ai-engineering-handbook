# Runs `alembic upgrade head` before a rollout (Argo CD sync-wave / Helm pre-upgrade hook style).
apiVersion: batch/v1
kind: Job
metadata:
  name: sentinel-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-migrate
    spec:
      serviceAccountName: sentinel
      restartPolicy: Never
      securityContext: &podsec
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: sentinel
          command: ["sentinel", "migrate"]
          envFrom:
            - configMapRef: {name: sentinel-config}
            - secretRef: {name: sentinel-secrets}
          securityContext: &csec
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
