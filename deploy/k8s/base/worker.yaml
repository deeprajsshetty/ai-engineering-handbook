apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinel-worker
  labels:
    app.kubernetes.io/name: sentinel-worker
spec:
  replicas: 2   # claims use FOR UPDATE SKIP LOCKED, so workers scale horizontally
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinel-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinel-worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
    spec:
      serviceAccountName: sentinel
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 120   # let an in-flight investigation finish
      containers:
        - name: worker
          image: sentinel
          command: ["sentinel", "worker"]
          ports:
            - {name: metrics, containerPort: 9100}
          envFrom:
            - configMapRef: {name: sentinel-config}
            - secretRef: {name: sentinel-secrets}
          env:
            - {name: SENTINEL_SERVICE_NAME, value: sentinel-worker}
            - {name: OTEL_SERVICE_NAME, value: sentinel-worker}
          livenessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 768Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
