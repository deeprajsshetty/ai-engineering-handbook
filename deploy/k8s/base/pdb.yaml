apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-api
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sentinel-api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sentinel-worker
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: sentinel-worker}
