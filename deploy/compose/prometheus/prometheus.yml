global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: demo

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: otel-collector       # all application + infrastructure metrics (via OTLP)
    static_configs:
      - targets: ["otel-collector:8889"]
  - job_name: otel-collector-self  # the collector's own health
    static_configs:
      - targets: ["otel-collector:8888"]
  - job_name: sentinel-api
    static_configs:
      - targets: ["sentinel-api:8000"]
  - job_name: sentinel-worker
    static_configs:
      - targets: ["sentinel-worker:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: tempo
    static_configs:
      - targets: ["tempo:3200"]
