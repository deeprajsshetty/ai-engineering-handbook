[project]
name = "sentinel-aiops"
version = "1.0.0"
description = "Sentinel: AI-agentic observability platform (alert correlation, RCA, human-approved remediation)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Deepraj S Shetty" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "tenacity>=8.3",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "prometheus-client>=0.20",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "fastapi-mcp>=0.3",
    # fastapi-mcp 0.4 is not compatible with the mcp 2.x SDK (Server() signature changed).
    "mcp>=1.10,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "locust>=2.29",
]

[project.scripts]
sentinel = "sentinel.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "N", "C4", "PT"]
ignore = ["S101", "RUF012", "B008", "N818", "UP046"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "S108", "PT018", "E501"]
"src/sentinel/migrations/**" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
packages = ["sentinel"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m \"not e2e\""
markers = [
    "e2e: requires the full docker compose stack (deselected by default)",
    "postgres: requires SENTINEL_TEST_DATABASE_URL pointing at PostgreSQL",
]

[tool.coverage.run]
source = ["sentinel"]
omit = ["*/migrations/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
