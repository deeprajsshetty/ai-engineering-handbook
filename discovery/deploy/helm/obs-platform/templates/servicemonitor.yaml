{{- if .Values.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "obs.fullname" . }}
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels: {{- include "obs.selector" . | nindent 6 }}
  endpoints:
    - { port: http, path: /metrics, interval: 30s }
{{- end }}
