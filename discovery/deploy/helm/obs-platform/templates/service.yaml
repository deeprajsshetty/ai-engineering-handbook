apiVersion: v1
kind: Service
metadata:
  name: {{ include "obs.fullname" . }}
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "obs.selector" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
