{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.api.replicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "obs.fullname" . }}-api
  labels: {{- include "obs.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "obs.selector" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
